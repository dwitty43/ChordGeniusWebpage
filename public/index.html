<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nashville Chart Generator</title>
    <style>
        /* --- GLOBAL VARIABLES --- */
        :root {
            --primary: #4f46e5;      
            --primary-hover: #4338ca;
            --success: #10b981;      
            --success-hover: #059669;
            --upload: #8b5cf6;       
            --upload-hover: #7c3aed;
            
            --bg-color: #f3f4f6;     
            --card-bg: #ffffff;
            --input-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #d1d5db;
        }

        /* --- DARK MODE OVERRIDES --- */
        [data-theme="dark"] {
            --bg-color: #111827;     /* Deep gray/black background */
            --card-bg: #1f2937;      /* Darker card */
            --input-bg: #374151;     /* Dark inputs */
            --text-main: #f9fafb;    /* White text */
            --text-muted: #9ca3af;   /* Light gray text */
            --border: #374151;       /* Dark borders */
        }

        /* --- BASE STYLES --- */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .app-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 15px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 18px;
            color: var(--text-main);
        }

        /* --- LAYOUT SECTIONS --- */
        .section {
            padding-bottom: 30px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }
        .section:last-of-type {
            border-bottom: none;
            padding-bottom: 10px;
            margin-bottom: 0;
        }

        /* --- INPUTS & FORMS --- */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        input[type="text"] {
            flex: 1; 
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background-color: var(--input-bg); /* Added */
            color: var(--text-main);           /* Added */
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.3s, color 0.3s;
        }
        
        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        #songKey, #uploadKey {
            flex: 0 0 100px; /* Key inputs stay narrow */
        }

        /* File Input Styling */
        input[type="file"] {
            flex: 1;
            padding: 9px 12px;
            font-size: 14px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            color: var(--text-muted);
            background-color: var(--input-bg);
            cursor: pointer;
        }
        input[type="file"]::file-selector-button {
            margin-right: 12px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: var(--border);
        }

        /* --- BUTTONS --- */
        .button-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .format-select {
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        #searchBtn { background-color: var(--primary); }
        #searchBtn:hover { background-color: var(--primary-hover); }

        #uploadBtn { background-color: var(--upload); }
        #uploadBtn:hover { background-color: var(--upload-hover); }

        .downloadBtn { background-color: var(--success); }
        .downloadBtn:hover:not(:disabled) { background-color: var(--success-hover); }

        button:disabled {
            background-color: #9ca3af;
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        /* --- STATUS BAR --- */
        #status {
            margin-top: 24px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            display: none; /* Hidden until needed */
        }
        
        .status-active { display: block !important; background-color: #f3f4f6; color: var(--text-muted); }
        .status-success { display: block !important; background-color: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        .status-error { display: block !important; background-color: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
    </style>
</head>
<body>
    <div class ="app-card">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h1 style="margin: 0;">🎸 Nashville Charts</h1>
            <button id="themeToggle" style="background: none; border: none; padding: 8px; cursor: pointer; color: var(--text-main); box-shadow: none; flex: none; width: auto;">
                <svg id="moonIcon" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                <svg id="sunIcon" style="display: none;" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            </button>
        </div>
        <p class="subtitle">Search the web or upload your own chart to instantly convert it to Nashville Numbers.</p>

        <div class="section">
            <div class="input-group">
                <input type="text" id="songQuery" placeholder='Search (e.g. "Gravity John Mayer")'>
                <input type="text" id="songKey" placeholder='Key (Opt)'>
            </div>
            
            <div class="button-group">
                <button id="searchBtn">Scrape & Convert</button>
                    <select id="searchFormat" class="format-select">
                        <option value="docx">.DOCX</option>
                        <option value="pdf">.PDF</option>
                    </select>
                <button id="downloadSearchBtn" class="downloadBtn" disabled>Download Chart</button>
            </div>
        </div>

        <div class="section">
            <h3>Or Upload a File</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: -10px; margin-bottom: 15px;">
                Supported formats: <strong>.txt</strong>, <strong>.docx</strong> (Max 5MB)
            </p>
            <div class="input-group">
                <input type="file" id="fileInput" accept=".txt,.docx">
                <input type="text" id="uploadKey" placeholder='Key (Req)'>
            </div>
            
            <div class="button-group">
                <button id="uploadBtn">Convert File</button>
                    <select id="uploadFormat" class="format-select">
                        <option value="docx">.DOCX</option>
                        <option value="pdf">.PDF</option>
                    </select>
                <button id="downloadUploadBtn" class="downloadBtn" disabled>Download Chart</button>
            </div>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        // --- DARK MODE LOGIC ---
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        
        // Check local storage for saved preference
        let currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') applyDarkTheme();

        themeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            if (currentTheme === 'dark') {
                applyDarkTheme();
            } else {
                applyLightTheme();
            }
        });

        function applyDarkTheme() {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            moonIcon.style.display = 'none';
            sunIcon.style.display = 'block';
        }

        function applyLightTheme() {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }

        let currentDownloadUrl = null;
        let currentFilename = "Chart.docx";
        const statusDiv = document.getElementById('status');

        function setupDownload(blob, filenameHeader) {
            if (currentDownloadUrl) window.URL.revokeObjectURL(currentDownloadUrl);
            currentDownloadUrl = window.URL.createObjectURL(blob);
            
            if (filenameHeader && filenameHeader.includes('filename="')) {
                currentFilename = filenameHeader.split('filename="')[1].split('"')[0];
            } else {
                currentFilename = "Converted_Chart.docx";
            }
        }

        function triggerDownload() {
            if (!currentDownloadUrl) return;
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = currentDownloadUrl;
            a.download = currentFilename;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function showStatus(text, type) {
            statusDiv.className = ''; 
            statusDiv.innerText = text;
            if (type === 'active') statusDiv.classList.add('status-active');
            if (type === 'success') statusDiv.classList.add('status-success');
            if (type === 'error') statusDiv.classList.add('status-error');
        }

        // --- SEARCH LOGIC ---
        const searchBtn = document.getElementById('searchBtn');
        searchBtn.addEventListener('click', async () => {
            const query = document.getElementById('songQuery').value;
            const key = document.getElementById('songKey').value;
            const format = document.getElementById('searchFormat').value;
            const dlBtn = document.getElementById('downloadSearchBtn');

            if (!query) return showStatus("Please enter a song name!", "error");

            // UI Loading State
            const originalBtnHTML = searchBtn.innerHTML;
            searchBtn.innerHTML = "⏳ Scraping...";
            searchBtn.disabled = true;
            dlBtn.disabled = true;
            showStatus("Searching Ultimate Guitar and converting chords...", "active");

            try {
                // FIXED: Now properly appends &format=pdf to the URL!
                let url = `/api/convert?q=${encodeURIComponent(query)}&format=${format}`;
                if (key) url += `&key=${encodeURIComponent(key)}`;

                const response = await fetch(url);
                if (!response.ok) throw new Error((await response.json()).error || "Conversion failed.");

                setupDownload(await response.blob(), response.headers.get('Content-Disposition'));
                
                // Update button to reflect the chosen format
                dlBtn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Download .${format.toUpperCase()}`;
                dlBtn.disabled = false;
                showStatus("Chart generated! Ready to download.", "success");

            } catch (error) {
                showStatus(`Error: ${error.message}`, "error");
            } finally {
                // Restore original button state
                searchBtn.innerHTML = originalBtnHTML;
                searchBtn.disabled = false;
            }
        });

        document.getElementById('downloadSearchBtn').addEventListener('click', triggerDownload);

        // --- UPLOAD LOGIC ---
        const uploadBtn = document.getElementById('uploadBtn');
        uploadBtn.addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            const key = document.getElementById('uploadKey').value;
            const format = document.getElementById('uploadFormat').value;
            const dlBtn = document.getElementById('downloadUploadBtn');
            const file = fileInput.files[0];

            if (!file) return showStatus("Please select a file to upload!", "error");
            if (!key) return showStatus("You must provide the original key for uploaded files!", "error");

            const validExtensions = ['.txt', '.docx'];
            const fileName = file.name.toLowerCase();

            if (!validExtensions.some(ext => fileName.endsWith(ext))) {
                return showStatus("Security Block: Only .txt and .docx files are allowed.", "error");
            }
            if (file.size > 5 * 1024 * 1024) {
                return showStatus("File is too large! Maximum allowed size is 5MB.", "error");
            }
            
            // UI Loading State
            const originalBtnHTML = uploadBtn.innerHTML;
            uploadBtn.innerHTML = "⏳ Converting...";
            uploadBtn.disabled = true;
            dlBtn.disabled = true;
            showStatus("Uploading and aligning chart...", "active");

            const formData = new FormData();
            formData.append('chartFile', fileInput.files[0]);
            formData.append('key', key);
            formData.append('format', format);

            try {
                const response = await fetch('/api/import', { method: 'POST', body: formData });
                if (!response.ok) throw new Error((await response.json()).error || "Conversion failed.");

                setupDownload(await response.blob(), response.headers.get('Content-Disposition'));
                
                // Update button to reflect the chosen format
                dlBtn.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> Download .${format.toUpperCase()}`;
                dlBtn.disabled = false;
                showStatus("File converted! Ready to download.", "success");

            } catch (error) {
                showStatus(`Error: ${error.message}`, "error");
            } finally {
                // Restore original button state
                uploadBtn.innerHTML = originalBtnHTML;
                uploadBtn.disabled = false;
            }
        });

        document.getElementById('downloadUploadBtn').addEventListener('click', triggerDownload);
    </script>
</body>
</html>
